<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyykkeri – Map</title>
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
<main class="content wide">
  <div class="results-layout">
    <div class="cards">
      <p class="hint">Cards column (see group-card.html). Needs `npm run dev` and public/maps/uusimaa.pmtiles.</p>
    </div>
    <aside class="map-panel" aria-label="Ryhmät kartalla">
      <div class="map contact-labels">
        <div id="map" class="map-canvas"></div>
        <button class="secondary map-expand" aria-pressed="false">Suurenna kartta</button>
        <ul class="map-legend">
          <li><span class="key icon"><svg class="map-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2 8 8 2.7 14 8M4 6.6v6.9h8V6.6M6.7 13.5v-3.7h2.6v3.7"/></svg></span>Koti</li>
          <li><span class="key icon"><svg class="map-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 2.5h4v3.5h3.5v4H10v3.5H6V10H2.5V6H6z"/></svg></span>Terveysasema</li>
          <li><span class="key network"></span>Nykyiset SOTE-yhteydet</li>
          <li><span class="key group">A</span>Ryhmät</li>
        </ul>
      </div>
    </aside>
  </div>
</main>
<script type="module" src="./map.ts"></script>
</body>
</html>
