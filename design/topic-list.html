<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyykkeri – Topic list</title>
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
<main class="content">
  <section class="panel">
    <h2>Tunnistetut aiheet</h2>
    <div class="tags editable">
      <span class="tag matched" title="Kokee voimakasta yksinäisyyttä, lapset asuvat ulkomailla.">Yksinäisyys<button class="tag-remove" aria-label="Poista aihe: Yksinäisyys">×</button></span>
      <span class="tag matched">Masennus<button class="tag-remove" aria-label="Poista aihe: Masennus">×</button></span>
      <span class="tag matched">Suru<button class="tag-remove" aria-label="Poista aihe: Suru">×</button></span>
      <span class="tag matched">Ikääntyneet<button class="tag-remove" aria-label="Poista aihe: Ikääntyneet">×</button></span>
      <select><option selected disabled>Lisää aihe</option><option>Ahdistus</option><option>Unihäiriöt</option></select>
    </div>
  </section>
</main>
</body>
</html>
