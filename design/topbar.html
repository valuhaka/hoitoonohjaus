<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyykkeri – Top bar</title>
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
<!-- Narrow the window below 720px to see the menu button; add class "menu-open" to the header to open the panel -->
<header class="topbar">
  <button class="menu-toggle" aria-expanded="false" aria-controls="topbar-menu" aria-label="Avaa valikko">
    <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>
  <strong class="brand"><img class="brand-logo" src="../public/logo/doctorcat.png" alt="" />Psyykkeri</strong>
  <div id="topbar-menu" class="topbar-menu">
    <div class="topbar-left">
      <button class="secondary home-button">Etusivu</button>
    </div>
    <div class="topbar-right">
      <div class="lang-switch" role="group" aria-label="Kieli">
        <button class="segment active" aria-pressed="true">FI</button>
        <button class="segment" aria-pressed="false">SV</button>
        <button class="segment" aria-pressed="false">EN</button>
      </div>
      <button class="link">Kirjaudu ulos</button>
    </div>
  </div>
</header>
</body>
</html>
