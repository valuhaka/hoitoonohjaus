<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyykkeri – Top bar</title>
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div>
      <strong>Psyykkeri</strong>
      <small>Länsi-Uudenmaan hyvinvointialue</small>
    </div>
    <button class="badge data-switch synthetic" role="switch" aria-checked="false"
      title="Vaihda synteettisten demoryhmien ja todellisten palvelujen välillä. Potilaat ovat aina synteettisiä.">
      <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
      DEMO · synteettinen data
    </button>
  </div>
  <div class="topbar-right">
    <div class="lang-switch" role="group" aria-label="Kieli / Språk / Language">
      <button class="segment active" aria-pressed="true">FI</button>
      <button class="segment" aria-pressed="false">SV</button>
      <button class="segment" aria-pressed="false">EN</button>
    </div>
    <button class="link">Kirjaudu ulos</button>
  </div>
</header>
</body>
</html>
