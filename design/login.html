<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyykkeri – Login</title>
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
<main class="center">
  <section class="panel login">
    <h1>Kirjaudu sisään</h1>
    <fieldset class="role-choice">
      <legend class="visually-hidden">Kirjaudu</legend>
      <label class="role-option"><input type="radio" name="role" /><strong>Potilas</strong></label>
      <label class="role-option"><input type="radio" name="role" /><strong>Toisen puolesta</strong></label>
      <label class="role-option active"><input type="radio" name="role" checked /><strong>Ammattilainen</strong></label>
    </fieldset>
    <button class="primary wide">Vahva tunnistautuminen</button>
    <p class="hint">Ei käytössä demossa. Kirjaudu käyttäjätunnuksella.</p>
    <div class="divider">tai</div>
    <form>
      <label>Käyttäjätunnus <input value="demo" /></label>
      <label>Salasana <input type="password" value="demo" /></label>
      <p class="error">Virheellinen käyttäjätunnus tai salasana</p>
      <button class="secondary wide" type="submit">Kirjaudu</button>
    </form>
  </section>
</main>
</body>
</html>
