<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyykkeri – Filters</title>
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
<main class="content">
  <div class="filters">
    <label>
      Alkaa
      <select><option selected>Milloin tahansa</option><option>2 viikon sisällä</option><option>Kuukauden sisällä</option></select>
    </label>
    <label class="suggested" title="Ehdotettu potilastietojen perusteella: Ikä 68 v (henkilötunnus)">
      Ajankohta
      <select><option>Mikä tahansa</option><option selected>Päivällä</option><option>Iltaisin</option></select>
    </label>
    <div role="group" aria-label="Hinta" class="range-filter suggested" title="Ehdotettu potilastietojen perusteella: Taloudellinen tilanne tiukka, eläke pieni.">
      <span class="range-label">Hinta<output>0–10 €</output></span>
      <div class="range" style="--lo: 0%; --hi: 33.3%">
        <input type="range" min="0" max="30" step="1" value="0" aria-label="Hinta: Vähintään" />
        <input type="range" min="0" max="30" step="1" value="10" aria-label="Hinta: Enintään" />
      </div>
    </div>
    <div role="group" aria-label="Etäisyys" class="range-filter">
      <span class="range-label">Etäisyys<output>Kaikki</output></span>
      <div class="range" style="--lo: 0%; --hi: 100%">
        <input type="range" min="0" max="100" step="5" value="0" aria-label="Etäisyys: Vähintään" />
        <input type="range" min="0" max="100" step="5" value="100" aria-label="Etäisyys: Enintään" />
      </div>
    </div>
    <button class="secondary">Tyhjennä suodattimet</button>
  </div>
</main>
</body>
</html>
